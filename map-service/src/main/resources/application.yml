server:
  port: 8085

spring:
  application:
    name: map-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:city-common.yaml?group=CITY_PLATFORM&refreshEnabled=true
      - optional:nacos:map-service.yaml?group=CITY_PLATFORM&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        group: CITY_PLATFORM
        namespace: ${NACOS_NAMESPACE:public}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        group: CITY_PLATFORM
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:city_map}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: ${DRUID_INITIAL_SIZE:2}
      min-idle: 2
      max-active: 20
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      async-init: ${DRUID_ASYNC_INIT:false}
      fail-fast: false
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

city:
  security:
    internal-token: ${INTERNAL_TOKEN:}
  map:
    key: ${TENCENT_MAP_KEY:}
    # WebServiceAPI 签名校验的 SK；未开启签名校验时留空
    sk: ${TENCENT_MAP_SK:}
    js-api-key: ${TENCENT_MAP_JS_KEY:}
    base-url: ${TENCENT_MAP_BASE_URL:https://apis.map.qq.com}
    timeout-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,threaddump,heapdump,httptrace,caches,scheduledtasks
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.city.platform: info
    com.alibaba.nacos: warn
