# 容器内运行：通过 Docker 网络服务名访问基础设施
spring:
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/city_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
  data:
    redis:
      host: ${REDIS_HOST:redis}
