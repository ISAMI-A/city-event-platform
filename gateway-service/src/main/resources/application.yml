server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:city-common.yaml?group=CITY_PLATFORM&refreshEnabled=true
      - optional:nacos:gateway-service.yaml?group=CITY_PLATFORM&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        group: CITY_PLATFORM
        namespace: ${NACOS_NAMESPACE:public}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        group: CITY_PLATFORM
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: system-ping
          uri: ${CITY_USER_SERVICE_URI:lb://user-service}
          predicates:
            - Path=/api/v1/system/ping
        - id: user-service
          uri: ${CITY_USER_SERVICE_URI:lb://user-service}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/workers/**,/api/v1/recruitments/**
        - id: event-service
          uri: ${CITY_EVENT_SERVICE_URI:lb://event-service}
          predicates:
            - Path=/api/v1/events/**,/api/v1/attachments/**,/api/v1/notifications/**
        - id: event-uploads
          uri: ${CITY_EVENT_SERVICE_URI:lb://event-service}
          predicates:
            - Path=/uploads/**
        - id: workorder-service
          uri: ${CITY_WORKORDER_SERVICE_URI:lb://workorder-service}
          predicates:
            - Path=/api/v1/workorders/**
        - id: ai-service
          uri: ${CITY_AI_SERVICE_URI:lb://ai-service}
          predicates:
            - Path=/api/v1/ai/**
        - id: map-service
          uri: ${CITY_MAP_SERVICE_URI:lb://map-service}
          predicates:
            - Path=/api/v1/map/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.city.platform: info
    org.springframework.cloud.gateway: info
    com.alibaba.nacos: warn
